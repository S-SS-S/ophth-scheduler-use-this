name: Clinical platform bootstrap cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clinical-platform-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time deployment workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ophth-scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/clinical-platform-bootstrap.yml
          rm -f .github/workflows/clinical-platform-automerge.yml
          rm -f .github/workflows/clinical-platform-cleanup.yml
          git add -A
          git commit -m "chore: remove one-time clinical platform deployment workflows"
          git push origin HEAD:main
